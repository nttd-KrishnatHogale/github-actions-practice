name: Matrix and Jobs Practice

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:
    name: Test - ${{ matrix.os }} - Python ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Display matrix information
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Python: ${{ matrix.python-version }}"

      - name: Run tests
        run: pytest