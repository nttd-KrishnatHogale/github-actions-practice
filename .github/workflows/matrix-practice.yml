name: Matrix and Jobs Practice

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
  runs-on: ubuntu-latest

  outputs:
    version: ${{ steps.version.outputs.app_version }}

  steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate application version
      id: version
      shell: bash
      run: |
        echo "app_version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

    - name: Display version
      run: |
        echo "Application version: ${{ steps.version.outputs.app_version }}"

  test:
    needs: build
    name: Test - ${{ matrix.os }} - Python ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
        exclude:
          - os: windows-latest
            python-version: "3.10"
        include:
          - os: ubuntu-latest
            python-version: "3.13"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Display matrix information
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Python: ${{ matrix.python-version }}"

      - name: Run tests
        run: pytest

