name: Environment Deployment Practice

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - production

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: |
          echo "Building application..."
          echo "Build completed successfully"

  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: ${{ inputs.environment }}

    concurrency:
      group: deployment-${{ inputs.environment }}
      cancel-in-progress: false

    steps:

      - name: Deployment information
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Application URL: ${{ vars.APP_URL }}"

      - name: Check deployment secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "Deployment token is available"
          else
            echo "Deployment token is missing"
            exit 1
          fi

      - name: Deploy application
        run: |
          echo "Deploying application..."
          echo "Target: ${{ vars.APP_URL }}"
          sleep 20
          echo "Deployment completed"

      - name: Deployment summary
        run: |
          echo "Successfully deployed to ${{ inputs.environment }}"