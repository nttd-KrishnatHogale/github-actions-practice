name: Cache and Artifact Practice

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # - name: Cache pip dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Create build output
        run: |
          mkdir build
          echo "Application Build" > build/build-info.txt
          echo "Run Number: ${{ github.run_number }}" >> build/build-info.txt
          cp app.py build/

      - name: Display build output
        run: |
          ls -la build
          cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: build/
          retention-days: 5

  verify:
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: application-build
          path: downloaded-build

      - name: Display downloaded artifact
        run: |
          ls -la downloaded-build
          cat downloaded-build/build-info.txt

      - name: Verify application artifact
        run: |
          test -f downloaded-build/app.py
          echo "Artifact verification successful"